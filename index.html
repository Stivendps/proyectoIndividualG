<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">  <!-- no lee en -->
</head>

<body>

    <!-- formulario panel izquierdo-->
    <div class="contenedoruno d-flex">
        <div class="sidebar d-flex flex-column flex-shrink-0 p-4">
            <div class="encabezado-sidebar">
                <a href="/"
                class="d-flex align-items-center text-white text-decoration-none"> <svg
                    class="bi pe-none me-2" width="40" height="32" aria-hidden="true">
                    <use xlink:href="#bootstrap"></use>
                </svg> <span class="fs-4">Tareas Diarias</span> </a>
                <div class="dropdown">
                    <button class="btn-tema dropdown-toggle" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false" title="Cambiar tema">
                        <i class="bi bi-palette"></i>
                        <span>Tema</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                        <li><a class="dropdown-item tema" data-tema="morado">MORADO</a></li>
                        <li><a class="dropdown-item tema" data-tema="black">OSCURO</a></li>
                        <li><a class="dropdown-item tema" data-tema="white">CLARO</a></li>
                        <li><a class="dropdown-item tema" data-tema="green">VERDE</a></li>
                    </ul>
                </div>
            </div>
            <button id="btnMobileAgregar" class="btn-mobile-agregar" type="button">
                <i class="bi bi-plus-lg"></i>
                Agregar tarea
            </button>
            <hr>
            <div class="contact-form">
                <div class="formulario-mobile-header">
                    <h4 class="mb-4">Agregar tarea</h4>
                    <button id="btnCerrarFormulario" class="btn-cerrar-formulario" type="button" aria-label="Cerrar formulario">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label bi bi-people-fill""> Asignar a</label>
                            <select id="asignado" class="form-select ">
                                <option selected>Por asignar</option>
                                <option>Rhonald</option>
                                <option>Carlos</option>
                                <option>Laura</option>
                                <option>María</option>
                                <option>Otro</option>
                                </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label ">Estado</label>
                            <select id="estado" class="form-select">
                                <option value="1">! Normal</option>
                                <option value="2">!! Importante</option>
                                <option value="3">!!! Obligatorio</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre de tarea</label>
                        <input id="titulo" type="text" class="form-control" placeholder="titulo de tarea">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Descripcion</label>
                        <textarea id="descripcion" class="form-control" rows="5"
                            placeholder="Descriva la tarea ..."></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Fecha de la tarea</label>
                        <input id="fecha" type="date" class="form-control">
                    </div>
                    <button id="btnAgregar" type="submit" class="btn btn-submit">Agregar tarea</button>
                </form>
            </div>
            <!-- se agrega div para usar alerta, dsaffdas  -->
            <div id="alerta" class="alerta">
                <span id="mensaje"></span>
            </div>
        </div>
        <!-- listado de las tareas panel derecho-->
        <div class="list flex-grow-1 p-4 tareas">
            <div class="estadisticas">
                <div class="card-stat glass active">
                    <i class="bi bi-list-task"></i>
                    <h2 id="totalTareas">0</h2>
                    <p>Total</p>
                </div>
                <div class="card-stat glass">
                    <i class="bi bi-hourglass-split"></i>
                    <h2 id="pendientes">0</h2>
                    <p>Pendientes</p>
                </div>
                <div class="card-stat glass">
                    <i class="bi bi-check-circle"></i>
                    <h2 id="completadas">0</h2>
                    <p>Completadas</p>
                </div>
                <div class="card-stat glass">
                    <i class="bi bi-exclamation-triangle"></i>
                    <h2 id="vencidas">0</h2>
                    <p>Vencidas</p>
                </div>
            </div>
            <div class="separador"></div>
            <div class="contenedor-lista">
                <div id="listaTareas" class="list-group w-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>

</html>
