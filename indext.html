<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <!-- formulario -->
    <div class="contenedoruno d-flex align-items-center">
        <div  class="sidebar d-flex flex-column flex-shrink-0 p-4"> <a href="/"
                class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none"> <svg
                    class="bi pe-none me-2" width="40" height="32" aria-hidden="true">
                    <use xlink:href="#bootstrap"></use>
                </svg> <span class="fs-4">Tarea </span> </a>
            <hr>
          <div class="contact-form">
                <h3 class="mb-4">Agregar tarea</h3>
                <form>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Fecha</label>
                      <input type="text" class="form-control" placeholder="dd/mm/aaaa">
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label">jerarquia</label>
                      <input type="text" class="form-control" placeholder="! !">
                    </div>
                  </div>
                  
                  <div class="mb-3">
                    <label class="form-label">Nombre de tarea</label>
                    <input type="email" class="form-control" placeholder="titulo de tarea">
                  </div>

                  <div class="mb-4">
                    <label class="form-label">Descripcion</label>
                    <textarea class="form-control" rows="5" placeholder="Descriva la tarea ..."></textarea>
                  </div>
                  
                  <button type="submit" class="btn btn-submit text-white">Agregar tarea</button>
                </form>

              </div>
            <hr>
            <div class="dropdown"> <a href="#"
                    class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false"> <img src="https://github.com/mdo.png" alt=""
                        width="32" height="32" class="rounded-circle me-2"> <strong>mdo</strong> </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><a class="dropdown-item" href="#">New project...</a></li>
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#">Sign out</a></li>
                </ul>
            </div>
        </div>

        <!-- listado -->

        <div class="flex-grow-1 p-4 tareas">
            <div class="list-group w-100">
                <label class="list-group-item d-flex gap-3">
                    <input class="form-check-input flex-shrink-0" type="checkbox" value="" checked=""
                        style="font-size: 1.375em;">
                    <span class="pt-1 form-checked-content">
                        <strong>Verificar estados de pedidos para entregar</strong>
                        <small class="d-block text-body-secondary"> <svg class="bi me-1" width="1em" height="1em"
                                role="img" aria-label="Schedule">
                                <use xlink:href="#calendar-event"></use>
                            </svg>
                            1:00–2:00pm
                        </small>
                    </span> 
                </label> 
                <label class="list-group-item d-flex gap-3">
                    <input class="form-check-input flex-shrink-0" type="checkbox" value="" checked=""
                        style="font-size: 1.375em;">
                    <span class="pt-1 form-checked-content">
                        <strong>Realizar solicitudde sita</strong>
                        <small class="d-block text-body-secondary"> <svg class="bi me-1" width="1em" height="1em"
                                role="img" aria-label="Schedule">
                                <use xlink:href="#calendar-event"></use>
                            </svg>
                            1:00–2:00pm
                        </small>
                    </span> 
                </label> 
                <label class="list-group-item d-flex gap-3"> <input
                        class="form-check-input flex-shrink-0" type="checkbox" value="" style="font-size: 1.375em;">
                    <span class="pt-1 form-checked-content"> <strong>Recoger pedidos</strong> <small
                            class="d-block text-body-secondary"> <svg class="bi me-1" width="1em" height="1em"
                                role="img" aria-label="Schedule">
                                <use xlink:href="#calendar-event"></use>
                            </svg>
                            2:00–2:30pm
                        </small> </span> </label> <label class="list-group-item d-flex gap-3"> <input
                        class="form-check-input flex-shrink-0" type="checkbox" value="" style="font-size: 1.375em;">
                    <span class="pt-1 form-checked-content"> <strong>Devolver pedidos con daños</strong> <small
                            class="d-block text-body-secondary"> <svg class="bi me-1" width="1em" height="1em"
                                role="img" aria-label="Reminder">
                                <use xlink:href="#alarm"></use>
                            </svg>
                            Tomorrow
                        </small> </span> </label> <label class="list-group-item d-flex gap-3 bg-body-tertiary"> <input
                        class="form-check-input form-check-input-placeholder bg-body-tertiary flex-shrink-0 pe-none"
                        disabled="" type="checkbox" value="" style="font-size: 1.375em;"> <span
                        class="pt-1 form-checked-content"> <span contenteditable="true" class="w-100">Preparar tareas
                            para el fin de smeana
                        </span> <small class="d-block text-body-secondary"> <svg class="bi me-1" width="1em"
                                height="1em" aria-hidden="true">
                                <use xlink:href="#list-check"></use>
                            </svg>
                            Choose list...
                        </small> </span> </label>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
